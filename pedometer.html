<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Pedometer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans JP',sans-serif;

    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    color:white;

    background:
    radial-gradient(circle at top,#7d2cff 0%,transparent 40%),
    radial-gradient(circle at bottom,#009dff 0%,transparent 45%),
    linear-gradient(180deg,#5518d9,#006eff);
}

/* 発光 */

.glow{
    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(120px);

    opacity:0.35;

    animation:float 8s ease-in-out infinite;
}

.glow1{
    background:#a855ff;
    top:-200px;
    left:-200px;
}

.glow2{
    background:#00aaff;
    bottom:-200px;
    right:-200px;

    animation-delay:4s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(30px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* 全体 */

.container{

    position:relative;

    z-index:10;

    width:100%;

    min-height:100vh;

    padding:25px;

    display:flex;
    flex-direction:column;
}

/* 戻る */

.back{

    font-size:18px;

    font-weight:700;

    opacity:0.85;

    margin-bottom:20px;

    text-decoration:none;

    color:white;
}

/* タイトル */

.title{

    text-align:center;

    margin-top:10px;
}

.titleSmall{

    font-size:20px;

    opacity:0.8;

    margin-bottom:10px;
}

.stepCount{

    font-size:96px;

    font-weight:900;

    line-height:1;

    text-shadow:
    0 0 20px rgba(255,255,255,0.5),
    0 0 50px rgba(0,170,255,0.45);

    animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}

.message{

    margin-top:18px;

    font-size:18px;

    opacity:0.9;
}

    
/* ガラスカード */

.stats{

    margin-top:45px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

.card{

    background:rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(20px);

    border-radius:28px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.cardLabel{

    font-size:15px;

    opacity:0.75;

    margin-bottom:12px;
}

.cardValue{

    font-size:34px;

    font-weight:900;
}

/* ボタン */

.controls{

    margin-top:auto;

    padding-top:50px;

    display:flex;

    flex-direction:column;

    gap:16px;
}

.btn{

    width:100%;

    border:none;

    border-radius:999px;

    padding:20px;

    font-size:18px;

    font-weight:800;

    color:white;

    cursor:pointer;

    transition:0.25s;

    backdrop-filter:blur(20px);
}

.startBtn{

    background:
    linear-gradient(90deg,
    rgba(0,180,255,0.8),
    rgba(130,90,255,0.8));

    box-shadow:
    0 0 30px rgba(0,170,255,0.4);
}

.startBtn:hover{

    transform:translateY(-3px);
}

.resetBtn{

    background:
    rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.1);
}

/* 状態 */

.status{

    margin-top:15px;

    text-align:center;

    font-size:14px;

    opacity:0.8;
}

/* 著作権 */

.footer{

    margin-top:18px;

    text-align:center;

    color:rgba(255,255,255,0.35);

    font-size:13px;

    letter-spacing:1px;

    font-weight:600;
}
    /*切り替えアニメーション*/
    .pageTransition{

    position:fixed;
    inset:0;

    z-index:9999;

    pointer-events:none;

    background:
    radial-gradient(circle at top,#7d2cff 0%,transparent 40%),
    radial-gradient(circle at bottom,#009dff 0%,transparent 45%),
    linear-gradient(180deg,#5518d9,#006eff);

    opacity:0;

    transition:opacity 0.5s ease;
}

.pageTransition.active{

    opacity:1;
}
    .infoBox{

    margin-top:22px;

    padding:18px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.08);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.18);
}

.infoTitle{

    font-size:14px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:12px;

    opacity:0.9;
}

.infoText{

    font-size:13px;

    line-height:1.9;

    color:
    rgba(255,255,255,0.72);
}
/*歩数は確実ではない*/
.notice{

    margin-top:25px;
    margin-bottom:12px;

    text-align:center;

    font-size:13px;

    color:rgba(255,255,255,0.55);

    line-height:1.6;
}

    .gpsInfo{

    margin-top:18px;

    text-align:center;

    font-size:14px;

    color:rgba(255,255,255,0.7);

    line-height:1.6;
    }
</style>
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">

    <div class="back" id="backBtn">
        ← ホームに戻る
    </div>

    <div class="title">

        <div class="titleSmall">
            今日の歩数
        </div>

        <div class="stepCount" id="stepCount">
            0
        </div>

        <div class="message">
            今日もいい感じ。
        </div>

    </div>

    <div class="gpsInfo" id="gpsInfo">
    GPS待機中...
    </div>
    <div class="stats">

        <div class="card">

            <div class="cardLabel">
                距離
            </div>

            <div class="cardValue" id="distance">
                0.0km
            </div>

        </div>

        <div class="card">

            <div class="cardLabel">
                消費
            </div>

            <div class="cardValue" id="calories">
                0kcal
            </div>

        </div>

    </div>

    <div class="controls">
<div class="notice">
    ※歩数データは参考値です
</div>

        <button class="btn startBtn" id="startBtn">
            START
        </button>

        <button class="btn resetBtn" id="resetBtn">
            RESET
        </button>

    </div>

    <div class="status" id="status">
        停止中
    </div>
<div class="infoBox">

    <div class="infoTitle">
        INFORMATION
    </div>

    <div class="infoText">

        ・START時に位置情報の許可が必要です<br>

        ・未使用時のアクティビティを許可してください<br>

        ・移動後に再度STARTを押すことで、
        距離が加算されます

    </div>

</div>
    <div class="footer">
        ©2026 Solpon
    </div>

</div>

<script>

/* =========================
   状態
========================= */

let running = false;

let watchId = null;

let totalDistance = 0;

let lastPosition = null;

let pathPoints = [];

/* =========================
   要素
========================= */

const stepEl =
document.getElementById("stepCount");

const distanceEl =
document.getElementById("distance");

const caloriesEl =
document.getElementById("calories");

const statusEl =
document.getElementById("status");

const gpsInfoEl =
document.getElementById("gpsInfo");

const startBtn =
document.getElementById("startBtn");

/* =========================
   保存
========================= */

function saveData(){

    localStorage.setItem(
        "solponDistance",
        totalDistance
    );

    localStorage.setItem(
        "solponPath",
        JSON.stringify(pathPoints)
    );

}

/* =========================
   距離計算
========================= */

function getDistance(lat1, lon1, lat2, lon2){

    const R = 6371000;

    const dLat =
    (lat2 - lat1)
    * Math.PI / 180;

    const dLon =
    (lon2 - lon1)
    * Math.PI / 180;

    const a =
    Math.sin(dLat/2)
    *
    Math.sin(dLat/2)
    +
    Math.cos(lat1 * Math.PI/180)
    *
    Math.cos(lat2 * Math.PI/180)
    *
    Math.sin(dLon/2)
    *
    Math.sin(dLon/2);

    const c =
    2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R * c;

}

/* =========================
   UI更新
========================= */

function updateUI(){

    const km =
    (totalDistance / 1000)
    .toFixed(2);

    distanceEl.textContent =
    km + "km";

    /*
      推定歩数
      0.7m歩幅
    */

    const estimatedSteps =
    Math.round(
        totalDistance / 0.7
    );

    stepEl.textContent =
    estimatedSteps;

    /*
      超ざっくり
    */

    const calories =
    Math.round(
        estimatedSteps * 0.04
    );

    caloriesEl.textContent =
    calories + "kcal";

}

/* =========================
   GPS取得
========================= */

function onLocation(position){

    const lat =
    position.coords.latitude;

    const lon =
    position.coords.longitude;

    const accuracy =
    position.coords.accuracy;

    gpsInfoEl.textContent =
    "GPS精度 ±"
    +
    Math.round(accuracy)
    +
    "m";

    const point = {
        lat,
        lon,
        time:Date.now()
    };

    pathPoints.push(point);

    /*
      前回地点あり
    */

    if(lastPosition){

        const dist =
        getDistance(
            lastPosition.lat,
            lastPosition.lon,
            lat,
            lon
        );

        /*
          GPS飛び対策
        */

        if(
            dist > 1 &&
            dist < 80
        ){

            totalDistance += dist;

        }

    }

    lastPosition = {
        lat,
        lon
    };

    updateUI();

    saveData();

}

/* =========================
   GPSエラー
========================= */

function onError(err){

    gpsInfoEl.textContent =
    "GPS取得失敗";

    console.log(err);

}

/* =========================
   開始
========================= */

function startTracking(){

    if(running){

        running = false;

        startBtn.textContent =
        "START";

        statusEl.textContent =
        "停止中";

        gpsInfoEl.textContent =
        "GPS停止";

        navigator.geolocation
        .clearWatch(watchId);

        return;

    }

    running = true;

    startBtn.textContent =
    "STOP";

    statusEl.textContent =
    "計測中...";

    gpsInfoEl.textContent =
    "GPS接続中...";

    watchId =
    navigator.geolocation.watchPosition(

        onLocation,

        onError,

        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:10000
        }

    );

}

/* =========================
   リセット
========================= */

function reset(){

    totalDistance = 0;

    lastPosition = null;

    pathPoints = [];

    updateUI();

    saveData();

}

/* =========================
   復帰検知
========================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

    if(
        document.visibilityState
        === "visible"
        &&
        running
    ){

        gpsInfoEl.textContent =
        "GPS再接続中...";

    }

});

/* =========================
   起動時
========================= */

totalDistance =
Number(
localStorage.getItem(
"solponDistance"
)
) || 0;

pathPoints =
JSON.parse(
localStorage.getItem(
"solponPath"
)
) || [];

updateUI();

/* =========================
   ボタン
========================= */

startBtn.addEventListener(
    "click",
    startTracking
);

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    reset
);

    document
.getElementById("backBtn")
.addEventListener(
"click",
()=>{

    const transition =
    document.getElementById(
        "transition"
    );

    /*
      表示
    */

    transition.classList.add(
        "active"
    );

    /*
      少し待つ
    */

    setTimeout(()=>{

        sessionStorage.setItem(
    "returnedFromApp",
    "true"
);
        window.location.href =
        "index.html?skipSplash=true";

    },550);

});
</script>
    <div class="pageTransition" id="transition"></div>
</body>
</html>
