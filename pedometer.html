<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Pedometer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans JP',sans-serif;

    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    color:white;

    background:
    radial-gradient(circle at top,#7d2cff 0%,transparent 40%),
    radial-gradient(circle at bottom,#009dff 0%,transparent 45%),
    linear-gradient(180deg,#5518d9,#006eff);
}

/* 発光 */

.glow{
    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(120px);

    opacity:0.35;

    animation:float 8s ease-in-out infinite;
}

.glow1{
    background:#a855ff;
    top:-200px;
    left:-200px;
}

.glow2{
    background:#00aaff;
    bottom:-200px;
    right:-200px;

    animation-delay:4s;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(30px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* 全体 */

.container{

    position:relative;

    z-index:10;

    width:100%;

    min-height:100vh;

    padding:25px;

    display:flex;
    flex-direction:column;
}

/* 戻る */

.back{

    font-size:18px;

    font-weight:700;

    opacity:0.85;

    margin-bottom:20px;

    text-decoration:none;

    color:white;
}

/* タイトル */

.title{

    text-align:center;

    margin-top:10px;
}

.titleSmall{

    font-size:20px;

    opacity:0.8;

    margin-bottom:10px;
}

.stepCount{

    font-size:96px;

    font-weight:900;

    line-height:1;

    text-shadow:
    0 0 20px rgba(255,255,255,0.5),
    0 0 50px rgba(0,170,255,0.45);

    animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}

.message{

    margin-top:18px;

    font-size:18px;

    opacity:0.9;
}

/* ガラスカード */

.stats{

    margin-top:45px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

.card{

    background:rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(20px);

    border-radius:28px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.cardLabel{

    font-size:15px;

    opacity:0.75;

    margin-bottom:12px;
}

.cardValue{

    font-size:34px;

    font-weight:900;
}

/* ボタン */

.controls{

    margin-top:auto;

    padding-top:50px;

    display:flex;

    flex-direction:column;

    gap:16px;
}

.btn{

    width:100%;

    border:none;

    border-radius:999px;

    padding:20px;

    font-size:18px;

    font-weight:800;

    color:white;

    cursor:pointer;

    transition:0.25s;

    backdrop-filter:blur(20px);
}

.startBtn{

    background:
    linear-gradient(90deg,
    rgba(0,180,255,0.8),
    rgba(130,90,255,0.8));

    box-shadow:
    0 0 30px rgba(0,170,255,0.4);
}

.startBtn:hover{

    transform:translateY(-3px);
}

.resetBtn{

    background:
    rgba(255,255,255,0.12);

    border:
    1px solid rgba(255,255,255,0.1);
}

/* 状態 */

.status{

    margin-top:15px;

    text-align:center;

    font-size:14px;

    opacity:0.8;
}

/* 著作権 */

.footer{

    margin-top:18px;

    text-align:center;

    color:rgba(255,255,255,0.35);

    font-size:13px;

    letter-spacing:1px;

    font-weight:600;
}
    /*切り替えアニメーション*/
    .pageTransition{

    position:fixed;
    inset:0;

    z-index:9999;

    pointer-events:none;

    background:
    radial-gradient(circle at top,#7d2cff 0%,transparent 40%),
    radial-gradient(circle at bottom,#009dff 0%,transparent 45%),
    linear-gradient(180deg,#5518d9,#006eff);

    opacity:0;

    transition:opacity 0.5s ease;
}

.pageTransition.active{

    opacity:1;
}
/*歩数は確実ではない*/
.notice{

    margin-top:25px;
    margin-bottom:12px;

    text-align:center;

    font-size:13px;

    color:rgba(255,255,255,0.55);

    line-height:1.6;
}
</style>
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">

    <div class="back" id="backBtn">
        ← ホームに戻る
    </div>

    <div class="title">

        <div class="titleSmall">
            今日の移動
        </div>

        <div class="stepCount" id="stepCount">
            0
        </div>

        <div class="message">
            今日もいい感じ。
        </div>

    </div>

    <div class="stats">

        <div class="card">

            <div class="cardLabel">
                距離
            </div>

            <div class="cardValue" id="distance">
                0.0km
            </div>

        </div>

        <div class="card">

            <div class="cardLabel">
                消費
            </div>

            <div class="cardValue" id="calories">
                0kcal
            </div>

        </div>

    </div>

    <div class="controls">
<div class="notice">
    ※歩数データは参考値です
</div>
        <button class="btn startBtn" id="startBtn">
            START
        </button>

        <button class="btn resetBtn" id="resetBtn">
            RESET
        </button>

    </div>

    <div class="status" id="status">
        停止中
    </div>

    <div class="footer">
        ©2026 Solpon
    </div>

</div>

<script>

let tracking = false;

let totalDistance = 0;

let lastPosition = null;

let watchId = null;

/* 要素 */

const stepEl =
document.getElementById("stepCount");

const distanceEl =
document.getElementById("distance");

const caloriesEl =
document.getElementById("calories");

const statusEl =
document.getElementById("status");

const startBtn =
document.getElementById("startBtn");

/* 保存 */

function saveData(){

    localStorage.setItem(
        "totalDistance",
        totalDistance
    );

}

/* UI更新 */

function updateUI(){

    /*
      距離(km)
    */

    distanceEl.textContent =
    totalDistance.toFixed(2)
    + "km";

    /*
      歩数推定
      1歩 = 0.7m
    */

    const estimatedSteps =
    Math.round(
        (totalDistance * 1000)
        / 0.7
    );

    stepEl.textContent =
    estimatedSteps;

    /*
      消費カロリー
      超ざっくり
    */

    const calories =
    Math.round(
        totalDistance * 55
    );

    caloriesEl.textContent =
    calories + "kcal";

}

/* 距離計算 */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;

    const dLat =
    (lat2 - lat1)
    * Math.PI / 180;

    const dLon =
    (lon2 - lon1)
    * Math.PI / 180;

    const a =
    Math.sin(dLat / 2)
    *
    Math.sin(dLat / 2)
    +
    Math.cos(lat1 * Math.PI / 180)
    *
    Math.cos(lat2 * Math.PI / 180)
    *
    Math.sin(dLon / 2)
    *
    Math.sin(dLon / 2);

    const c =
    2 *
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );

    return R * c;

}

/* GPS取得 */

function onLocation(position){

    const lat =
    position.coords.latitude;

    const lon =
    position.coords.longitude;

    const accuracy =
    position.coords.accuracy;

    /*
      精度悪すぎる時は無視
    */

    if(accuracy > 40){

        return;

    }

    if(lastPosition){

        const distance =
        calculateDistance(
            lastPosition.lat,
            lastPosition.lon,
            lat,
            lon
        );

        /*
          GPS暴走対策
        */

        if(
            distance > 0.003
            &&
            distance < 0.3
        ){

            totalDistance += distance;

            updateUI();

            saveData();

        }

    }

    lastPosition = {
        lat,
        lon
    };

}

/* GPSエラー */

function onError(error){

    console.log(error);

    statusEl.textContent =
    "GPSエラー";

}

/* 開始 */

function startTracking(){

    if(tracking){

        tracking = false;

        startBtn.textContent =
        "START";

        statusEl.textContent =
        "停止中";

        navigator.geolocation
        .clearWatch(watchId);

        watchId = null;

        return;

    }

    if(
        !navigator.geolocation
    ){

        alert(
            "GPS非対応です"
        );

        return;

    }

    tracking = true;

    startBtn.textContent =
    "STOP";

    statusEl.textContent =
    "GPS計測中...";

    watchId =
    navigator.geolocation.watchPosition(

        onLocation,

        onError,

        {

            enableHighAccuracy:true,

            maximumAge:0,

            timeout:10000

        }

    );

}

/* リセット */

function reset(){

    totalDistance = 0;

    lastPosition = null;

    updateUI();

    saveData();

}

/* 起動時 */

totalDistance =
Number(
localStorage.getItem(
    "totalDistance"
)
) || 0;

updateUI();

/* ボタン */

startBtn.addEventListener(
    "click",
    startTracking
);

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    reset
);

/* 戻る */

document
.getElementById("backBtn")
.addEventListener(
"click",
()=>{

    const transition =
    document.getElementById(
        "transition"
    );

    transition.classList.add(
        "active"
    );

    setTimeout(()=>{

        window.location.href =
        "index.html?skipSplash=true";

    },500);

});

</script>
    <div class="pageTransition" id="transition"></div>
</body>
</html>
